app:
  bootstrap:
    # Password of the administrator created on a fresh install. Override it in every real deployment.
    admin-password: ${ADMIN_PASSWORD:admin123}

spring:
  application:
    name: TheArchivist

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  ai:
    vectorstore:
      qdrant:
        collection-name: archivist-lore
        initialize-schema: false

    model:
      # Spring AI 2.1 added decision models, auto-configured unless told otherwise. The app does not use them,
      # and the OpenAI one would demand an API key even in dev.
      decision: none